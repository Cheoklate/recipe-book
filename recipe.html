<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe - Cheoklate's Recipe Book</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header no-print">
    <a href="index.html" class="back-link">&larr; All recipes</a>
  </header>

  <main class="container recipe-detail" id="recipe-detail">
    <p id="not-found" hidden>Recipe not found. <a href="index.html">Back to all recipes</a>.</p>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-prev" aria-label="Previous photo">&#10094;</button>
    <div class="lightbox-viewport">
      <div class="lightbox-track">
        <img class="lightbox-slide" data-slide="prev" src="" alt="" draggable="false">
        <img class="lightbox-slide" data-slide="current" src="" alt="" draggable="false">
        <img class="lightbox-slide" data-slide="next" src="" alt="" draggable="false">
      </div>
    </div>
    <button class="lightbox-next" aria-label="Next photo">&#10095;</button>
  </div>

  <script src="js/recipe.js"></script>
</body>
</html>
