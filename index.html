<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheoklate's Recipe Book</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Cheoklate's Recipe Book</h1>
  </header>

  <main class="container home-layout">
    <button
      id="filter-toggle"
      class="filter-toggle no-print"
      type="button"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      Filters &amp; sort
    </button>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-section">
        <input
          type="search"
          id="search-input"
          placeholder="Search by name or ingredient..."
          aria-label="Search recipes"
        />
      </div>

      <div class="sidebar-section">
        <label for="sort-select" class="sidebar-label">Sort by</label>
        <select id="sort-select" aria-label="Sort recipes">
          <option value="title-asc">Name (A&ndash;Z)</option>
          <option value="title-desc">Name (Z&ndash;A)</option>
          <option value="recent">Recently added</option>
        </select>
      </div>

      <div class="sidebar-section sidebar-filters-header">
        <span class="sidebar-label">Filter by tag</span>
        <button id="clear-filters" class="clear-filters" type="button" hidden>Clear all</button>
      </div>

      <div id="tag-filters" class="tag-filters" aria-label="Filter by tag"></div>
    </aside>

    <div class="home-main">
      <p id="empty-state" class="empty-state" hidden>No recipes match your search.</p>
      <div id="recipe-grid" class="recipe-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Add recipes by editing <code>data/recipes.json</code>.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
